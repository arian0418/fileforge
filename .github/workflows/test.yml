name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: g++ -std=c++17 -Wall -Wextra -pedantic fileforge.cpp -o fileforge
      - run: python -m unittest discover -v
