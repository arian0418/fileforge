name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: g++ -std=c++17 -Wall -Wextra -pedantic -O2 fileforge.cpp -o fileforge
      - run: xvfb-run -a python -m unittest discover -v
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: g++ -std=c++17 -Wall -Wextra -pedantic -O2 -municode fileforge.cpp -o fileforge.exe
      - run: python -m unittest test_engine test_fileforge -v
